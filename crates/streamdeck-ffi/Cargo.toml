[package]
name = "streamdeck-ffi"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Plugin OpenDeck que dispara efeitos do soundbar ao apertar uma tecla"

[[bin]]
name = "soundbar-plugin"
path = "src/main.rs"

[dependencies]
soundbar-core = { path = "../soundbar-core" }
openaction = "2.7"
anyhow.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
log = "0.4"
simplelog = "0.12"
