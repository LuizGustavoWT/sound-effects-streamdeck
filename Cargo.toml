[workspace]
resolver = "2"
members = [
    "crates/soundbar-core",
    "crates/soundbar-audio",
    "crates/streamdeck-ffi",
    "crates/soundbar-cli",
    "crates/soundbar-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LuizGustavoWT/sound-effects-streamdeck"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
