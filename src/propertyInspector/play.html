<!doctype html>
<html lang="pt-BR">
	<head>
		<script>
			let update = () => {};
			let ws = null;
			let ctx = null;
			let lastEffect = "";

			function sendToPlugin(payload) {
				if (ws && ctx) {
					ws.send(JSON.stringify({ event: "setSettings", context: ctx, payload: payload }));
				}
			}

			function currentSettings() {
				return {
					effect: document.getElementById("effect").value,
					gain: parseFloat(document.getElementById("gain").value) || 1.0,
					label: document.getElementById("label").value,
					toggle: document.getElementById("toggle").checked,
				};
			}

			function setEffectName(name) {
				document.getElementById("effectName").textContent = name || "(nenhum)";
				document.getElementById("clear").style.display = name ? "inline-block" : "none";
			}

			function applyEffects(list, selected) {
				const sel = document.getElementById("effect");
				const chosen = selected || sel.value || lastEffect;
				sel.innerHTML = "";

				const empty = document.createElement("option");
				empty.value = "";
				empty.textContent = "(nenhum)";
				sel.appendChild(empty);

				list.forEach(function (e) {
					const o = document.createElement("option");
					o.value = e.id;
					o.textContent = e.name;
					if (e.id === chosen) o.selected = true;
					sel.appendChild(o);
				});

				const found = list.find(function (e) {
					return e.id === chosen;
				});
				lastEffect = chosen;
				setEffectName(found ? found.name : "");
			}

			function pickFile() {
				// O seletor nativo do navegador funciona dentro do sandbox do
				// OpenDeck; um dialogo do sistema, nao.
				document.getElementById("fileInput").click();
			}

			function readAsDataURL(file) {
				return new Promise(function (resolve, reject) {
					const fr = new FileReader();
					fr.onload = () => resolve(fr.result);
					fr.onerror = () => reject(new Error("falha ao ler o arquivo"));
					fr.readAsDataURL(file);
				});
			}

			async function onFileChosen(ev) {
				const file = ev.target.files[0];
				if (!file) return;

				const maxBytes = 50 * 1024 * 1024;
				if (file.size > maxBytes) {
					showStatus("Arquivo muito grande (max 50 MB)", true);
					ev.target.value = "";
					return;
				}

				showStatus("Enviando " + file.name + " (" + Math.round(file.size / 1024) + " KB)...", false);

				try {
					const data = await readAsDataURL(file);

					// Payload separado, so com o arquivo. Misturar no
					// setSettings faria o OpenDeck gravar o base64 inteiro no
					// perfil, a cada tecla.
					ws.send(
						JSON.stringify({
							event: "sendToPlugin",
							context: ctx,
							payload: { importData: data, importName: file.name },
						})
					);

					showStatus("Processando " + file.name + "...", false);
				} catch (err) {
					showStatus("Erro: " + err.message, true);
				}
				ev.target.value = "";
			}

			function showStatus(text, isError) {
				const el = document.getElementById("status");
				el.textContent = text;
				el.className = isError ? "err" : "";
			}

			function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				ws = new WebSocket("ws://localhost:" + inPort);
				ctx = JSON.parse(inActionInfo).context;

				ws.onopen = () => {
					ws.send(JSON.stringify({ event: inRegisterEvent, uuid: inPropertyInspectorUUID }));
				};

				ws.onmessage = (event) => {
					try {
						const msg = JSON.parse(event.data);
						if (msg.event !== "sendToPropertyInspector" || !msg.payload) return;

						const p = msg.payload;
						if (p.effects) {
							applyEffects(p.effects, p.selected);
							if (p.selected) {
								// Seleciona o efeito importado e grava apenas os
								// campos limpos (sem base64).
								document.getElementById("effect").value = p.selected;
								update();
								showStatus("Importado: " + p.selected, false);
							}
						} else if (p.error) {
							showStatus("Erro: " + p.error, true);
						}
					} catch (err) {
						console.error("PI: mensagem invalida", err);
					}
				};

				const s = JSON.parse(inActionInfo).payload.settings;
				lastEffect = s.effect ?? "";
				document.getElementById("effect").value = lastEffect;
				document.getElementById("gain").value = s.gain ?? 1.0;
				document.getElementById("label").value = s.label ?? "";
				document.getElementById("toggle").checked = s.toggle ?? true;

				update = () => {
					const sel = document.getElementById("effect");
					const opt = sel.options[sel.selectedIndex];
					setEffectName(opt && opt.value ? opt.text : "");
					sendToPlugin(currentSettings());
				};

				// Dispara update() uma vez para popular a lista.
				update();
			}
		</script>
		<link rel="stylesheet" href="sdpi.css" />
		<style>
			.sb-row {
				display: flex;
				gap: 0.4rem;
				align-items: stretch;
			}
			.sb-row select {
				flex: 1;
				min-width: 0;
			}
			.sb-btn {
				padding: 0.3rem 0.6rem;
				white-space: nowrap;
				cursor: pointer;
				border-radius: 3px;
				border: 1px solid #555;
				background: #2a2a2e;
				color: #ddd;
			}
			.sb-btn:hover {
				background: #35353b;
			}
			.sb-btn-primary {
				background: #2a6df4;
				border-color: #2a6df4;
				color: #fff;
			}
			.sb-btn-primary:hover {
				background: #3d7cf5;
			}
			#status {
				padding: 0.4rem 0.75rem;
				color: #9a9;
				font-size: 0.78rem;
				min-height: 1.1rem;
			}
			#status.err {
				color: #e77;
			}
			.sb-name {
				color: #8ab4f8;
				font-size: 0.8rem;
				padding: 0.2rem 0.75rem 0;
			}
		</style>
	</head>
	<body>
		<div class="sdpi-item">
			<div class="sdpi-item-label">Efeito</div>
			<div class="sb-row">
				<select id="effect" class="sdpi-item-value" onchange="update()"></select>
				<button class="sb-btn sb-btn-primary" onclick="pickFile()">Escolher arquivo...</button>
				<button class="sb-btn" id="clear" onclick="document.getElementById('effect').value='';update()" style="display:none">X</button>
			</div>
			<div class="sb-name" id="effectName"></div>
		</div>

		<div class="sdpi-item">
			<div class="sdpi-item-label">Ganho (0.0 - 4.0)</div>
			<input id="gain" type="number" step="0.1" min="0" max="4" class="sdpi-item-value" oninput="update()" />
		</div>

		<div class="sdpi-item">
			<div class="sdpi-item-label">Texto na tecla</div>
			<input id="label" type="text" class="sdpi-item-value" oninput="update()" />
		</div>

		<div class="sdpi-item">
			<div class="sdpi-item-label">Modo toggle</div>
			<input id="toggle" type="checkbox" class="sdpi-item-value" onchange="update()" />
			<label for="toggle"><span></span></label>
		</div>

		<input type="file" id="fileInput" accept="audio/*,.wav,.mp3,.flac,.ogg,.oga,.opus,.aiff,.m4a,.aac" style="display:none" onchange="onFileChosen(event)" />

		<div id="status">
			Clique em <b>Escolher arquivo...</b> para importar um mp3, wav, ogg ou flac.
		</div>
	</body>
</html>
